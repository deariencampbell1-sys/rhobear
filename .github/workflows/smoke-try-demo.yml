name: Try demo smoke

on:
  workflow_run:
    workflows: ["Deploy RHOBEAR site to Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    name: try.html chat smoke
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run try.html smoke
        run: npx playwright test tests-e2e/try-demo-smoke.spec.js --browser=chromium --reporter=line --output=test-results

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: try-demo-smoke-failure
          path: test-results
          if-no-files-found: ignore
